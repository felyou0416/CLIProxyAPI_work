[package]
name = "cliproxyapi-tauri"
version = "1.5.0"
description = "CLIProxyAPI Dashboard Tauri shell"
authors = ["CLIProxyAPI"]
edition = "2021"

[lib]
name = "cliproxyapi_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.5.1", features = ["tray-icon"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
