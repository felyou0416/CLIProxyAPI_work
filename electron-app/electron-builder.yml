appId: com.cliproxyapi.dashboard
productName: CLIProxyAPI Dashboard
directories:
  output: dist

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CLIProxyAPI Dashboard
  # Avoid leaving old shortcuts / partial installs confusing users.
  deleteAppDataOnUninstall: false
  runAfterFinish: true

files:
  - "**/*"
  - "!node_modules/.cache"
  - "!dist"
  - "!resources"

extraResources:
  - from: resources/
    to: "."