name: Build Tauri GUI

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release for current version'
        required: false
        default: false
        type: boolean
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  tauri-windows:
    name: Tauri Windows GUI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=v$version" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-go@v5
        with:
          go-version-file: CLIProxyAPI/CLIProxyAPI/go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: mlugg/setup-zig@v2
        with:
          version: '0.13.0'

      - uses: dtolnay/rust-toolchain@stable

      - name: Build service resources
        shell: pwsh
        run: |
          cd CLIProxyAPI/CLIProxyAPI
          go build -o bin\cli-proxy-api.exe ./cmd/server/
          cd ../..
          .\CLIProxyAPI-AccessGateway\build.ps1 -Output CLIProxyAPI-AccessGateway\cli-access-gateway.exe
          .\CLIProxyAPI-MediaProxy\build.ps1 -Output CLIProxyAPI-MediaProxy\cli-media-proxy.exe
          .\CLIProxyAPI-ClaudeAdapter\build.ps1 -Output CLIProxyAPI-ClaudeAdapter\cli-claude-adapter.exe
          .\CLIProxyAPI-LocalPlugin\build.ps1

      - name: Build Dashboard
        shell: pwsh
        run: |
          cd CLIProxyAPI-Dashboard
          python -m pip install --upgrade pip
          pip install pyinstaller psutil pywinpty pyyaml
          pyinstaller build.spec

      - name: Stage Tauri resources
        shell: pwsh
        run: .\apps\tauri-gui\scripts\stage-windows.ps1

      - name: Install Tauri CLI
        working-directory: apps/tauri-gui
        run: npm install

      - name: Build Tauri GUI
        working-directory: apps/tauri-gui
        run: npm run build

      - name: List build outputs
        shell: pwsh
        run: |
          Get-ChildItem -Path apps/tauri-gui/src-tauri/target/release/bundle -Recurse -File |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: cliproxyapi-tauri-windows-v${{ steps.version.outputs.VERSION }}
          path: |
            apps/tauri-gui/src-tauri/target/release/bundle/nsis/*.exe
            apps/tauri-gui/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.TAG }}
          name: "CLIProxyAPI Dashboard ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.TAG }}"
          files: |
            apps/tauri-gui/src-tauri/target/release/bundle/nsis/*.exe
            apps/tauri-gui/src-tauri/target/release/bundle/msi/*.msi
          generate_release_notes: true
          fail_on_unmatched_files: true
