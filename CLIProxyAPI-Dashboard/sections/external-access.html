<section id="section-external-access" class="panel panel-scroll section-view external-access-panel" hidden>
  <div class="panel-head">
    <div>
      <div class="section-kicker">Access</div>
      <h2 class="section-title">外部 IP 放行</h2>
    </div>
    <div class="action-row">
      <button class="secondary" type="button" onclick="loadExternalAccessPanel(true)">刷新</button>
    </div>
  </div>

  <div class="tool-desc-zh">只为指定来源 IP / CIDR 放行指定端口，不处理公网路由、NAT 或端口绑定。</div>

  <div class="external-access-card">
    <div class="external-card-head">
      <div>
        <strong>指定外部来源</strong>
        <p>来源必须是明确的 IP 或 CIDR，不能使用 Any。适合给 VPN、固定公网出口或可信远端单独开入口。</p>
      </div>
    </div>
    <label class="external-port-field">
      <span>端口</span>
      <input id="external-port-input" type="text" inputmode="numeric" placeholder="例如：8765，或 8765,8317" />
    </label>
    <label class="external-port-field">
      <span>协议</span>
      <select id="external-protocol-input">
        <option value="TCP" selected>仅 TCP</option>
        <option value="UDP">仅 UDP</option>
        <option value="BOTH">TCP + UDP</option>
      </select>
    </label>
    <label class="external-port-field">
      <span>允许来源 IP / CIDR</span>
      <input id="external-remote-input" type="text" placeholder="例如：203.0.113.8，或 203.0.113.0/24" />
    </label>
    <div class="action-row">
      <button type="button" onclick="checkExternalAccessRules()">检查规则</button>
      <button type="button" class="secondary" onclick="allowExternalAccessRules()">放行来源</button>
      <button type="button" class="secondary" onclick="removeExternalAccessRules()">关闭放行</button>
    </div>
  </div>

  <div id="external-access-status" class="external-access-status"></div>
</section>
