<!-- panel-account + account.css：full-bleed，与聊天页同级铺满主区域 -->
<section id="section-account" class="panel panel-account section-view">
  <div class="panel-sub">
    <!--
      运行控制台挂载点：
      - 布局数据：js/control-station-config.js（CONTROL_STATION_LAYERS）
      - 渲染/点击：js/control-station.js → mountControlStation()
      - 在 showSection('account') 时挂载（core.js）
      下方 status-grid 仍为静态，不参与配置驱动。
    -->
    <div id="control-station-root" class="control-station"></div>
    <div id="local-workspace-root" class="control-station" hidden></div>

    <!-- 运行状态摘要（静态；与上方控制台分离） -->
    <div class="status-grid compact-grid">
      <div class="status-item">
        <div class="label" data-i18n="label.proxyProcess">Proxy Process</div>
        <div class="status-value" id="proxy-running"><span class="pill off" data-i18n="stopped">Not running</span></div>
      </div>
      <div class="status-item">
        <div class="label" data-i18n="hero.localUrl">Local URL</div>
        <div class="status-value status-value-copy">
          <code id="proxy-local-url">http://127.0.0.1:8317</code>
          <button class="status-copy-btn" type="button" title="复制本地地址" onclick="copyStatusField(this, 'proxy-local-url')">复制</button>
        </div>
      </div>
      <div class="status-item">
        <div class="label">Media Proxy</div>
        <div class="status-value" id="media-proxy-running"><span class="pill off">Not running</span></div>
      </div>
      <div class="status-item">
        <div class="label">Media URL</div>
        <div class="status-value"><code id="media-proxy-url">http://127.0.0.1:8320</code></div>
      </div>
      <div class="status-item">
        <div class="label" data-i18n="label.exposureMode">Exposure Mode</div>
        <div class="status-value" id="exposure-mode-status">Disabled</div>
      </div>
      <div class="status-item">
        <div class="label" data-i18n="label.exposureUrl">Exposure URL</div>
        <div class="status-value"><code id="proxy-exposure-url">-</code></div>
      </div>
      <div class="status-item">
        <div class="label" data-i18n="hero.apiKey">API Key</div>
        <div class="status-value status-value-copy">
          <code id="proxy-api-key">cliproxyapi</code>
          <button class="status-copy-btn" type="button" title="复制 API 密钥" onclick="copyStatusField(this, 'proxy-api-key')">复制</button>
        </div>
      </div>
      <div class="status-item status-item-accent">
        <div class="label">Imported Pool</div>
        <div class="status-value"><code>poixe · 38 free models</code></div>
      </div>
      <div class="status-item">
        <div class="label" data-i18n="label.runtimeAuthDir">Runtime auth-dir</div>
        <div class="status-value"><code id="active-auth-dir"></code></div>
      </div>
      <div class="status-item">
        <div class="label" data-i18n="label.runtimeConfig">Runtime Config</div>
        <div class="status-value"><code id="runtime-config"></code></div>
      </div>
    </div>
  </div>
</section>
