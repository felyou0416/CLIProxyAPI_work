<section id="section-settings" class="panel panel-scroll section-view">
  <div class="panel-head">
    <div>
      <h2 class="section-title" data-i18n="section.settingsTitle">Settings</h2>
    </div>
  </div>

  <div class="settings-tabs toolbar-scroll" id="settings-tabs">
    <button class="settings-tab active" data-tab="general" onclick="switchSettingsTab('general')">
      <span data-i18n="settings.tab.general">常用</span>
    </button>
    <button class="settings-tab" data-tab="version" onclick="switchSettingsTab('version')">
      <span data-i18n="settings.tab.version">版本</span>
    </button>
    <button class="settings-tab" data-tab="about" onclick="switchSettingsTab('about')">
      <span data-i18n="settings.tab.about">关于</span>
    </button>
  </div>

  <div class="settings-panel" id="settings-general">
    <div class="settings-card">
      <div class="settings-group">
        <div class="settings-group-header">
          <span data-i18n="settings.group.system">启动</span>
        </div>

        <div class="setting-row">
          <div class="setting-info">
            <label data-i18n="settings.row.autostart">开机自启面板</label>
          </div>
          <div class="setting-control">
            <label class="toggle-switch">
              <input type="checkbox" id="setting-autostart" onchange="saveSetting('autostart', this.checked)">
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-info">
            <label data-i18n="settings.row.minimizeTray">关闭时最小化到托盘</label>
          </div>
          <div class="setting-control">
            <label class="toggle-switch">
              <input type="checkbox" id="setting-minimize-tray" onchange="saveSetting('minimize_tray', this.checked)">
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </div>

      <div class="settings-group">
        <div class="settings-group-header">
          <span data-i18n="settings.group.appearance">语言与外观</span>
        </div>

        <div class="setting-row">
          <div class="setting-info">
            <label data-i18n="settings.row.language">语言</label>
          </div>
          <div class="setting-control">
            <select id="setting-language" onchange="saveSetting('language', this.value)">
              <option value="zh">简体中文</option>
              <option value="en">English</option>
            </select>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-info">
            <label data-i18n="settings.row.theme">主题</label>
          </div>
          <div class="setting-control">
            <select id="setting-theme" onchange="saveSetting('theme', this.value)">
              <option value="dark">Dark</option>
              <option value="bright">Bright</option>
            </select>
          </div>
        </div>
      </div>

      <details class="settings-group settings-group-fold">
        <summary class="settings-group-header">
          <span data-i18n="settings.group.updates">更新</span>
        </summary>

        <div class="setting-row">
          <div class="setting-info">
            <label data-i18n="settings.row.autoUpdateCheck">启动时检查更新</label>
          </div>
          <div class="setting-control">
            <label class="toggle-switch">
              <input type="checkbox" id="setting-auto-update-check" onchange="saveSetting('auto_update_check', this.checked)">
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-info">
            <label data-i18n="settings.row.updateChannel">更新通道</label>
          </div>
          <div class="setting-control">
            <select id="setting-update-channel" onchange="saveSetting('update_channel', this.value)">
              <option value="stable">Stable</option>
              <option value="beta">Beta</option>
              <option value="dev">Dev</option>
            </select>
          </div>
        </div>
      </details>

      <details class="settings-group settings-group-fold">
        <summary class="settings-group-header">
          <span data-i18n="settings.group.developer">高级</span>
        </summary>

        <div class="setting-row">
          <div class="setting-info">
            <label data-i18n="settings.row.clearCache">清理本地缓存</label>
          </div>
          <div class="setting-control">
            <button class="action-btn" onclick="clearLocalStorage()" style="margin: 0; padding: 6px 14px; font-size: 13px;">
              <span data-i18n="settings.btn.clearReload">清理并刷新</span>
            </button>
          </div>
        </div>
      </details>

      <details class="settings-group settings-group-fold" open>
        <summary class="settings-group-header">
          <span data-i18n="settings.group.accessPassword">访问密码</span>
        </summary>

        <div class="setting-row">
          <div class="setting-info">
            <label data-i18n="settings.row.accessPasswordStatus">面板访问密码</label>
          </div>
          <div class="setting-control">
            <span id="access-password-status" class="badge-style" style="margin-right: 8px; display: inline-block;">-</span>
            <button class="action-btn" onclick="togglePasswordSetup()" style="margin: 0; padding: 6px 14px; font-size: 13px;">
              <span id="access-password-btn" data-i18n="settings.btn.setPassword">设置密码</span>
            </button>
          </div>
        </div>

        <div id="access-password-form" style="display:none; padding-top: 12px; border-top: 1px solid var(--border-color, #eee);">
          <div class="setting-row" id="current-password-row" style="display:none;">
            <div class="setting-info">
              <label data-i18n="settings.row.currentPassword">Current password</label>
            </div>
            <div class="setting-control">
              <input type="password" id="current-password-input" class="form-input" style="width: 200px;" placeholder="">
            </div>
          </div>
          <div class="setting-row">
            <div class="setting-info">
              <label data-i18n="settings.row.newPassword">New password</label>
            </div>
            <div class="setting-control">
              <input type="password" id="new-password-input" class="form-input" style="width: 200px;" placeholder="">
            </div>
          </div>
          <div class="setting-row">
            <div class="setting-info">
              <label data-i18n="settings.row.confirmPassword">Confirm password</label>
            </div>
            <div class="setting-control">
              <input type="password" id="confirm-password-input" class="form-input" style="width: 200px;" placeholder="" onkeydown="if(event.key==='Enter')saveAccessPassword()">
            </div>
          </div>
          <div class="setting-row">
            <div class="setting-info"></div>
            <div class="setting-control" style="display: flex; gap: 8px;">
              <button class="primary action-btn" onclick="saveAccessPassword()" style="margin: 0; padding: 6px 14px; font-size: 13px;">
                <span data-i18n="settings.btn.savePassword">Save</span>
              </button>
              <button class="action-btn" onclick="cancelPasswordSetup()" style="margin: 0; padding: 6px 14px; font-size: 13px;">
                <span data-i18n="settings.btn.cancel">Cancel</span>
              </button>
              <button class="action-btn" id="remove-password-btn" onclick="removeAccessPassword()" style="margin: 0; padding: 6px 14px; font-size: 13px; display: none;">
                <span data-i18n="settings.btn.removePassword">Remove</span>
              </button>
            </div>
          </div>
        </div>
      </details>
    </div>
  </div>

  <div class="settings-panel" id="settings-version" hidden>
    <div class="settings-card">
      <div class="version-display-wrapper">
        <div class="version-display">
          <span class="version-badge" id="current-version">v1.0.0</span>
          <span class="version-date" id="build-date">Building...</span>
        </div>
      </div>
      <div class="version-matrix-grid">
        <div class="version-matrix-row">
          <span class="matrix-label" data-i18n="settings.row.cliVersion">CLIProxyAPI</span>
          <span class="matrix-value badge-style" id="cli-version">-</span>
        </div>
        <div class="version-matrix-row">
          <span class="matrix-label" data-i18n="settings.row.dashboardVersion">Dashboard</span>
          <span class="matrix-value badge-style" id="dashboard-version">-</span>
        </div>
        <div class="version-matrix-row">
          <span class="matrix-label" data-i18n="settings.row.desktopVersion">Desktop</span>
          <span class="matrix-value badge-style" id="desktop-version">-</span>
        </div>
        <div class="version-matrix-row">
          <span class="matrix-label" data-i18n="settings.row.lastUpdated">上次更新</span>
          <span class="matrix-value" id="last-updated">-</span>
        </div>
      </div>
      <div class="update-actions toolbar-scroll">
        <button class="primary action-btn" onclick="checkUpdates()">
          <span data-i18n="settings.btn.checkUpdates">检查更新</span>
        </button>
        <button class="action-btn" onclick="downloadLatest()">
          <span data-i18n="settings.btn.downloadLatest">下载最新</span>
        </button>
        <button class="action-btn" onclick="openReleasePage()">
          <span data-i18n="settings.btn.openRelease">发布页</span>
        </button>
      </div>
      <div id="update-status" class="update-status"></div>
    </div>
  </div>

  <div class="settings-panel" id="settings-about" hidden>
    <div class="settings-card about-card-wrapper">
      <div class="about-hero">
        <h3 data-i18n="settings.card.about">CLIProxyAPI</h3>
        <p class="app-description" data-i18n="settings.desc.about">统一管理多模型提供方的本地代理控制面板。</p>
      </div>
      <div class="about-links-grid">
        <div class="about-link-row" onclick="openReleasePage()">
          <div class="link-label-group">
            <span data-i18n="settings.row.repo">仓库</span>
          </div>
          <span class="link-url">github.com/youqu117/CLIProxyAPI_work</span>
        </div>
        <div class="about-link-row">
          <div class="link-label-group">
            <span data-i18n="settings.row.license">许可证</span>
          </div>
          <span class="link-val">MIT</span>
        </div>
      </div>
    </div>
  </div>
</section>
