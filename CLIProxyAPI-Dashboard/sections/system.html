<section id="section-system" class="panel panel-scroll section-view system-hub" hidden>
  <div class="panel-head system-hub-head">
    <div>
      <h2 class="section-title" data-i18n="section.systemTitle">系统中心</h2>
    </div>
    <div class="action-row toolbar-scroll">
      <button class="secondary" type="button" onclick="refreshStatus()" data-i18n="btn.refresh">刷新</button>
    </div>
  </div>

  <div class="system-hub-grid">
    <article class="system-hub-card primary-card">
      <h3>网络与入口</h3>
      <div class="system-link-grid">
        <button type="button" onclick="openSystemSection('network-access')">网络接入</button>
        <button type="button" onclick="openSystemSection('firewall-access')">端口放行</button>
        <button type="button" onclick="openSystemSection('home-config')">Home 控制面</button>
        <button type="button" onclick="openSystemSection('terminals')">终端</button>
      </div>
    </article>

    <article class="system-hub-card">
      <h3>路由与代理</h3>
      <div class="system-link-grid">
        <button type="button" onclick="openSystemSection('model-proxy')">模型代理</button>
        <button type="button" onclick="openSystemSection('cloaking-config')">请求伪装</button>
        <button type="button" onclick="openSystemSection('amp-config')">AMP 集成</button>
        <button type="button" onclick="openSystemSection('cooldown')">冷却状态</button>
        <button type="button" onclick="openSystemSection('model-stats')">模型统计</button>
        <button type="button" onclick="openSystemSection('model-thinking')">模型思考/推理配置</button>
      </div>
    </article>

    <article class="system-hub-card">
      <h3>部署与数据</h3>
      <div class="system-link-grid">
        <button type="button" onclick="openSystemSection('docker-deploy')">Docker</button>
        <button type="button" onclick="openSystemSection('storage-config')">存储后端</button>
        <button type="button" onclick="openSystemSection('data-transfer')">导入导出</button>
      </div>
    </article>

    <article class="system-hub-card">
      <h3>高级</h3>
      <div class="system-link-grid">
        <button type="button" onclick="openSystemSection('advanced-config')">高级配置</button>
        <button type="button" onclick="openSystemSection('settings')">面板设置</button>
      </div>
    </article>
  </div>
</section>
