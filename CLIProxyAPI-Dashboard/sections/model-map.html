<section id="section-model-map" class="panel panel-scroll section-view" hidden>
  <div class="model-map-layout">
    <!-- Left Column: Providers Sidebar List -->
    <div class="aggregate-panel-card model-map-sidebar-card" style="padding: 12px; margin: 0; background: var(--panel);">
      <div class="aggregate-panel-head" style="margin-bottom: 12px;">
        <div>
          <div class="aggregate-step-label">Workspace</div>
          <h3 data-i18n="section.modelMapProvidersTitle" style="margin: 0; font-size: 15px; font-weight: 800;">服务商列表</h3>
        </div>
      </div>
      <div id="provider-model-map-tabs" class="provider-model-map-tabs-vertical"></div>
    </div>

    <!-- Right Column: Active Mapping Details -->
    <div id="provider-model-map-list" class="provider-model-map-list" style="margin: 0;"></div>
  </div>

  <!-- 新增模型映射模态弹窗 -->
  <div id="add-model-mapping-modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 2000; align-items: center; justify-content: center;">
    <div class="modal" style="background: var(--panel); border: 1px solid var(--border); border-radius: 12px; width: 360px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); display: flex; flex-direction: column; overflow: hidden; transform: scale(0.96); opacity: 0; transition: all 0.15s ease;">
      <div class="modal-head" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border);">
        <h3 style="margin: 0; font-size: 15px; font-weight: 800;">新增模型映射</h3>
        <button type="button" class="secondary" style="min-width: 24px; width: 24px; height: 24px; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer;" onclick="hideAddMappingModal()">×</button>
      </div>
      <div class="modal-body" style="padding: 16px; display: flex; flex-direction: column; gap: 12px;">
        <label style="display: flex; flex-direction: column; gap: 6px;">
          <span style="font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase;">Provider ID</span>
          <input id="mapping-modal-provider" type="text" style="height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font-size: 13px;" readonly />
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px;">
          <span style="font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase;">原始 Model ID</span>
          <input id="mapping-modal-upstream" type="text" placeholder="例如：gpt-4o" style="height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font-size: 13px;" />
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px;">
          <span style="font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase;">本机调用 Model ID</span>
          <input id="mapping-modal-call" type="text" placeholder="例如：gpt-4o-custom" style="height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font-size: 13px;" />
        </label>
      </div>
      <div class="modal-foot" style="display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel-2);">
        <button type="button" class="secondary" style="min-height: 30px; padding: 0 12px; font-size: 12px; cursor: pointer;" onclick="hideAddMappingModal()">取消</button>
        <button type="button" style="min-height: 30px; padding: 0 12px; font-size: 12px; cursor: pointer;" onclick="handleAddMappingSubmit()">新增</button>
      </div>
    </div>
  </div>
</section>
