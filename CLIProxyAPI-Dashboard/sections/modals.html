<!-- 登录页面 -->
<div id="login-overlay" class="login-overlay" hidden>
  <div class="login-card">
    <div class="login-logo">CLI</div>
    <h2 data-i18n="login.title">访问口令</h2>
    <p class="login-subtitle" data-i18n="login.subtitle">请输入访问口令以进入控制面板</p>
    <form onsubmit="event.preventDefault(); submitLogin();">
      <div class="login-input-wrap">
        <label data-i18n="login.passwordLabel">访问口令</label>
        <input type="password" id="login-password" placeholder="" autofocus>
      </div>
      <button type="submit" class="login-btn" id="login-submit-btn" data-i18n="login.submit">登录</button>
      <div id="login-error" class="login-error" style="display:none;"></div>
    </form>
  </div>
</div>

<!-- 模态框: 添加自定义API Key -->
<div id="manual-auth-modal" class="modal-overlay" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3 data-i18n="modal.addManualAuthTitle">添加自定义 API Key</h3>
      <button class="nav-btn secondary" onclick="hideManualAuthModal()">×</button>
    </div>
    <div class="modal-body form-grid">
      <div class="form-group">
        <label data-i18n="label.provider">服务商 (Provider) - 可选</label>
        <input type="text" id="manual-auth-provider" class="form-input" placeholder="例如: openai / deepseek" list="manual-auth-provider-list" oninput="onManualAuthProviderInput(this.value)">
        <datalist id="manual-auth-provider-list"></datalist>
      </div>
      <div class="form-group">
        <label data-i18n="label.baseUrl">Base URL - 必填</label>
        <input type="text" id="manual-auth-base-url" class="form-input" placeholder="例如: https://api.openai.com/v1">
      </div>
      <div class="form-group">
        <label data-i18n="label.model">模型名称 (Model) - 必填</label>
        <input type="text" id="manual-auth-model" class="form-input" placeholder="例如: gpt-3.5-turbo">
      </div>
      <div class="form-group">
        <label data-i18n="label.apiKey">API Key - 必填</label>
        <input type="password" id="manual-auth-api-key" class="form-input" placeholder="sk-...">
      </div>
      <div class="form-group">
        <label data-i18n="label.remark">备注 (Remark) - 可选</label>
        <input type="text" id="manual-auth-remark" class="form-input" placeholder="用于识别该账号">
      </div>
    </div>
    <div class="modal-foot">
      <button class="secondary" onclick="hideManualAuthModal()" data-i18n="btn.cancel">取消</button>
      <button class="primary" onclick="submitManualAuth()" data-i18n="btn.save">保存</button>
    </div>
  </div>
</div>

<!-- 二级敏感操作验证模态框 -->
<div id="sensitive-auth-modal" class="modal-overlay" hidden>
  <div class="modal" style="max-width: 400px;">
    <div class="modal-head">
      <h3 data-i18n="sensitive.modal.title">敏感页面授权</h3>
      <button class="nav-btn secondary" onclick="cancelSensitiveAuth()">×</button>
    </div>
    <form onsubmit="event.preventDefault(); submitSensitiveAuth();">
      <div class="modal-body form-grid" style="display: flex; flex-direction: column; gap: 12px;">
        <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #666;" data-i18n="sensitive.modal.desc">
          您正在访问高权限敏感页面（终端、端口放行或网络接入），请输入专用的二级访问密钥进行授权。
        </p>
        <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-weight: 500; font-size: 13px;" data-i18n="sensitive.modal.label">二级验证密钥</label>
          <input type="password" id="sensitive-auth-key-input" class="form-input" placeholder="请输入授权密钥" data-i18n-placeholder="sensitive.modal.placeholder" style="width: 100%; box-sizing: border-box;" autofocus>
          <div id="sensitive-auth-error" class="login-error" style="display:none; color: red; font-size: 12px; margin-top: 4px;"></div>
        </div>
      </div>
      <div class="modal-foot" style="margin-top: 16px;">
        <button type="button" class="secondary" onclick="cancelSensitiveAuth()" data-i18n="settings.btn.cancel">取消</button>
        <button type="submit" class="primary" data-i18n="sensitive.modal.submit">授权进入</button>
      </div>
    </form>
  </div>
</div>

<!-- 账号文件配置编辑小工具 (Auth File Editor Modal) -->
<div id="auth-file-edit-modal" class="modal-overlay" style="overflow-y: auto; padding: 20px 0; box-sizing: border-box;" onclick="if(event.target===this)hideAuthFileEditModal()" hidden>
  <div class="modal" style="max-width: 820px; width: 95%; max-height: calc(100vh - 40px); display: flex; flex-direction: column; border-radius: 14px; box-shadow: 0 24px 52px rgba(0,0,0,0.18); border: 1px solid var(--border); overflow: hidden; margin: auto; background: var(--panel);">

    <!-- Modal Head -->
    <div class="modal-head" style="padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--panel);">
      <div style="display: flex; align-items: center; gap: 12px; overflow: hidden;">
        <span style="font-size: 16px; font-weight: 800; color: var(--text); white-space: nowrap;">⚙️ 账号文件配置编辑</span>
        <span id="afe-filename-chip" class="auth-chip active-chip" style="font-family: var(--mono); font-weight: 700; font-size: 12px;">-</span>
      </div>
      <button class="nav-btn secondary" type="button" onclick="hideAuthFileEditModal()" style="font-size: 20px; padding: 0; min-height: 28px; min-width: 28px; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 0; background: color-mix(in srgb, var(--panel-2) 85%, transparent); color: var(--text-soft); cursor: pointer; line-height: 1;" title="关闭">×</button>
    </div>

    <!-- Sub-header File Path Banner -->
    <div style="padding: 6px 20px; background: color-mix(in srgb, var(--panel-2) 80%, var(--accent)); border-bottom: 1px solid var(--border); font-size: 11px; color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
      <strong style="color: var(--text);">文件路径:</strong> <span id="afe-file-path" class="font-mono" style="opacity: 0.9;">-</span>
    </div>

    <!-- Mode Tabs Switcher -->
    <div class="req-detail-tabs" style="display: flex; gap: 4px; padding: 8px 20px 0; background: var(--panel); border-bottom: 1px solid var(--border);">
      <button type="button" class="req-tab-btn active" id="afe-mode-btn-form" onclick="switchAuthFileEditMode('form')">📝 表单可视化编辑</button>
      <button type="button" class="req-tab-btn" id="afe-mode-btn-raw" onclick="switchAuthFileEditMode('raw')">💻 原始 JSON 源码</button>
    </div>

    <!-- Modal Body -->
    <div class="modal-body" style="padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; flex: 1; min-height: 0;">

      <!-- Mode 1: Structured Form Editor -->
      <div id="afe-pane-form" style="display: flex; flex-direction: column; gap: 14px;">
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 16px;">

          <!-- Base URL -->
          <div class="form-group" style="display: flex; flex-direction: column; gap: 4px;">
            <label style="font-size: 11px; font-weight: 700; color: var(--text-soft);">接口地址 (base_url / BaseURL)</label>
            <input type="text" id="afe-form-base-url" class="form-input" placeholder="例如: https://api.openai.com/v1" style="height: 32px; font-size: 12px; font-family: var(--mono);">
          </div>

          <!-- API Key with show/hide toggle -->
          <div class="form-group" style="display: flex; flex-direction: column; gap: 4px;">
            <label style="font-size: 11px; font-weight: 700; color: var(--text-soft);">API Key / Token (api_key)</label>
            <div style="display: flex; gap: 6px; align-items: center;">
              <input type="password" id="afe-form-api-key" class="form-input" placeholder="sk-..." style="height: 32px; font-size: 12px; font-family: var(--mono); flex: 1;">
              <button type="button" class="secondary" id="afe-eye-btn" onclick="toggleAuthEditApiKeyMask()" style="height: 32px; padding: 0 10px; font-size: 12px; font-weight: 700;" title="显示/隐藏 Key">👁️</button>
            </div>
          </div>

          <!-- Provider -->
          <div class="form-group" style="display: flex; flex-direction: column; gap: 4px;">
            <label style="font-size: 11px; font-weight: 700; color: var(--text-soft);">提供方标识 (provider)</label>
            <input type="text" id="afe-form-provider" class="form-input" placeholder="例如: ung, openai, claude" style="height: 32px; font-size: 12px;">
          </div>

          <!-- Email -->
          <div class="form-group" style="display: flex; flex-direction: column; gap: 4px;">
            <label style="font-size: 11px; font-weight: 700; color: var(--text-soft);">绑定邮箱 / 账号 (email)</label>
            <input type="text" id="afe-form-email" class="form-input" placeholder="例如: account@qq.com" style="height: 32px; font-size: 12px;">
          </div>

          <!-- Status / Disabled -->
          <div class="form-group" style="display: flex; flex-direction: column; gap: 4px;">
            <label style="font-size: 11px; font-weight: 700; color: var(--text-soft);">账号使用状态 (disabled)</label>
            <select id="afe-form-disabled" class="form-input" style="height: 32px; font-size: 12px; font-weight: 700;">
              <option value="false">✅ 正常启用 (Enabled)</option>
              <option value="true">⛔ 停用锁定 (disabled: true)</option>
            </select>
          </div>

          <!-- Proxy URL -->
          <div class="form-group" style="display: flex; flex-direction: column; gap: 4px;">
            <label style="font-size: 11px; font-weight: 700; color: var(--text-soft);">独立前置代理 (proxy_url - 可选)</label>
            <input type="text" id="afe-form-proxy-url" class="form-input" placeholder="例如: http://127.0.0.1:7890" style="height: 32px; font-size: 12px; font-family: var(--mono);">
          </div>
        </div>

        <!-- Checkbox Switches Row -->
        <div style="display: flex; gap: 18px; align-items: center; background: var(--panel-2); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);">
          <label style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; cursor: pointer; user-select: none;">
            <input type="checkbox" id="afe-form-disable-cooling" style="accent-color: var(--accent); cursor: pointer;">
            <span>禁用自动触发冷却 (disable-cooling: true)</span>
          </label>
        </div>

        <!-- Models list textarea -->
        <div class="form-group" style="display: flex; flex-direction: column; gap: 4px;">
          <label style="font-size: 11px; font-weight: 700; color: var(--text-soft);">支持包含模型列表 (models - 逗号或换行分隔)</label>
          <textarea id="afe-form-models" class="form-input" rows="3" placeholder="例如: gpt-5.6-luna, gpt-5.6-terra, gpt-5.6-sol, codex-auto-review" style="font-size: 12px; font-family: var(--mono); padding: 8px; line-height: 1.4; resize: vertical;"></textarea>
        </div>

        <!-- Header Overrides / Custom Headers -->
        <div class="form-group" style="display: flex; flex-direction: column; gap: 4px;">
          <label style="font-size: 11px; font-weight: 700; color: var(--text-soft);">自定义 HTTP 请求头 (headers - JSON 字典)</label>
          <textarea id="afe-form-headers" class="form-input" rows="2" placeholder='{"X-Custom-Header": "value"}' style="font-size: 12px; font-family: var(--mono); padding: 8px; line-height: 1.4; resize: vertical;"></textarea>
        </div>

        <!-- Model Mapping -->
        <div class="form-group" style="display: flex; flex-direction: column; gap: 4px;">
          <label style="font-size: 11px; font-weight: 700; color: var(--text-soft);">模型重定向映射 (model_mapping - JSON 字典)</label>
          <textarea id="afe-form-model-mapping" class="form-input" rows="2" placeholder='{"gpt-4": "gpt-4o"}' style="font-size: 12px; font-family: var(--mono); padding: 8px; line-height: 1.4; resize: vertical;"></textarea>
        </div>
      </div>

      <!-- Mode 2: Raw JSON Textarea Editor -->
      <div id="afe-pane-raw" style="display: none; flex-direction: column; gap: 10px; flex: 1;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span id="afe-json-syntax-status" style="font-size: 12px; font-weight: 700; color: #10b981;">✓ JSON 语法格式正确</span>
          <button type="button" class="secondary" onclick="formatAuthFileRawJson()" style="height: 26px; padding: 0 10px; font-size: 11px; font-weight: 700;">✨ 格式化 / 美化 JSON</button>
        </div>
        <textarea id="afe-raw-json" class="form-input font-mono" rows="16" spellcheck="false" style="width: 100%; font-size: 12.5px; line-height: 1.5; padding: 10px; border-radius: 8px; resize: vertical; background: color-mix(in srgb, var(--panel-2) 90%, black); color: var(--text);" oninput="validateAuthFileRawJsonSyntax()"></textarea>
      </div>

    </div>

    <!-- Modal Footer -->
    <div class="modal-foot" style="padding: 10px 20px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: color-mix(in srgb, var(--panel) 96%, black);">
      <div id="afe-msg-alert" style="font-size: 12px; font-weight: 700; display: none;"></div>
      <div style="display: flex; gap: 10px; margin-left: auto;">
        <button class="secondary" type="button" onclick="hideAuthFileEditModal()" style="height: 32px; padding: 0 16px; font-size: 12px; border-radius: 6px; font-weight: 600;">取消</button>
        <button class="primary" type="button" onclick="submitAuthFileEdit()" style="height: 32px; padding: 0 18px; font-size: 12px; border-radius: 6px; font-weight: 700;">💾 保存并同步生效</button>
      </div>
    </div>

  </div>
</div>
