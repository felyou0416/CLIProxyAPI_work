<!-- 登录页面 -->
<div id="login-overlay" class="login-overlay" hidden>
  <div class="login-card">
    <div class="login-logo">CLI</div>
    <h2 data-i18n="login.title">访问口令</h2>
    <p class="login-subtitle" data-i18n="login.subtitle">请输入访问口令以进入控制面板</p>
    <form onsubmit="event.preventDefault(); submitLogin();">
      <div class="login-input-wrap">
        <label data-i18n="login.passwordLabel">访问口令</label>
        <input type="password" id="login-password" placeholder="" autofocus>
      </div>
      <button type="submit" class="login-btn" id="login-submit-btn" data-i18n="login.submit">登录</button>
      <div id="login-error" class="login-error" style="display:none;"></div>
    </form>
  </div>
</div>

<!-- 模态框: 添加自定义API Key -->
<div id="manual-auth-modal" class="modal-overlay" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3 data-i18n="modal.addManualAuthTitle">添加自定义 API Key</h3>
      <button class="nav-btn secondary" onclick="hideManualAuthModal()">×</button>
    </div>
    <div class="modal-body form-grid">
      <div class="form-group">
        <label data-i18n="label.provider">服务商 (Provider) - 可选</label>
        <input type="text" id="manual-auth-provider" class="form-input" placeholder="例如: openai / deepseek" list="manual-auth-provider-list" oninput="onManualAuthProviderInput(this.value)">
        <datalist id="manual-auth-provider-list"></datalist>
      </div>
      <div class="form-group">
        <label data-i18n="label.baseUrl">Base URL - 必填</label>
        <input type="text" id="manual-auth-base-url" class="form-input" placeholder="例如: https://api.openai.com/v1">
      </div>
      <div class="form-group">
        <label data-i18n="label.model">模型名称 (Model) - 必填</label>
        <input type="text" id="manual-auth-model" class="form-input" placeholder="例如: gpt-3.5-turbo">
      </div>
      <div class="form-group">
        <label data-i18n="label.apiKey">API Key - 必填</label>
        <input type="password" id="manual-auth-api-key" class="form-input" placeholder="sk-...">
      </div>
      <div class="form-group">
        <label data-i18n="label.remark">备注 (Remark) - 可选</label>
        <input type="text" id="manual-auth-remark" class="form-input" placeholder="用于识别该账号">
      </div>
    </div>
    <div class="modal-foot">
      <button class="secondary" onclick="hideManualAuthModal()" data-i18n="btn.cancel">取消</button>
      <button class="primary" onclick="submitManualAuth()" data-i18n="btn.save">保存</button>
    </div>
  </div>
</div>

<!-- 二级敏感操作验证模态框 -->
<div id="sensitive-auth-modal" class="modal-overlay" hidden>
  <div class="modal" style="max-width: 400px;">
    <div class="modal-head">
      <h3 data-i18n="sensitive.modal.title">敏感页面授权</h3>
      <button class="nav-btn secondary" onclick="cancelSensitiveAuth()">×</button>
    </div>
    <form onsubmit="event.preventDefault(); submitSensitiveAuth();">
      <div class="modal-body form-grid" style="display: flex; flex-direction: column; gap: 12px;">
        <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #666;" data-i18n="sensitive.modal.desc">
          您正在访问高权限敏感页面（终端、端口放行或网络接入），请输入专用的二级访问密钥进行授权。
        </p>
        <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-weight: 500; font-size: 13px;" data-i18n="sensitive.modal.label">二级验证密钥</label>
          <input type="password" id="sensitive-auth-key-input" class="form-input" placeholder="请输入授权密钥" data-i18n-placeholder="sensitive.modal.placeholder" style="width: 100%; box-sizing: border-box;" autofocus>
          <div id="sensitive-auth-error" class="login-error" style="display:none; color: red; font-size: 12px; margin-top: 4px;"></div>
        </div>
      </div>
      <div class="modal-foot" style="margin-top: 16px;">
        <button type="button" class="secondary" onclick="cancelSensitiveAuth()" data-i18n="settings.btn.cancel">取消</button>
        <button type="submit" class="primary" data-i18n="sensitive.modal.submit">授权进入</button>
      </div>
    </form>
  </div>
</div>
