[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "relayx-dashboard"
version = "0.1.0"
description = "RelayX dashboard CLI and local operations helpers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pywinpty>=2.0.14"]

[project.scripts]
relayx = "relayx_cli:main"

[tool.setuptools]
py-modules = ["relayx_cli", "app"]
include-package-data = false

[tool.setuptools.packages.find]
include = ["backend", "backend.*"]
