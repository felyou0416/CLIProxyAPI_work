<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CLIProxyAPI Codex Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260722" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=20260722" />
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=20260722" />
  <link rel="apple-touch-icon" href="/favicon.png?v=20260722" />
  <link rel="stylesheet" href="/dashboard.css?v=20260721-success-collapse" />
  <link rel="stylesheet" href="/css/atom-one-dark.min.css" />
</head>
<body>
<div class="app-shell sidebar-is-collapsed">
  <button class="mobile-nav-toggle" id="mobile-nav-toggle" type="button" onclick="toggleMobileNav()" aria-expanded="false" aria-controls="app-sidebar" title="打开导航">
    <span class="mobile-nav-toggle-bars" aria-hidden="true"></span>
    <span class="mobile-nav-toggle-label">菜单</span>
  </button>
  <div class="mobile-nav-scrim" id="mobile-nav-scrim" onclick="closeMobileNav()" hidden></div>

  <aside class="sidebar sidebar-collapsed" id="app-sidebar">
    <div class="sidebar-block brand-block">
      <button class="sidebar-collapse-toggle" id="sidebar-collapse-toggle" type="button" onclick="toggleSidebarCollapsed()" aria-expanded="false" title="展开侧栏">
        <div class="app-icon-squircle">
          <svg class="app-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 17 10 11 4 5" />
            <line x1="12" y1="19" x2="20" y2="19" />
          </svg>
        </div>
      </button>
      <div class="brand-text">
        <div class="brand-title">CLIProxyAPI</div>
        <div class="brand-sub" data-i18n="hero.title">CLIProxyAPI Codex Dashboard</div>
      </div>
      <button class="mobile-nav-close" type="button" onclick="closeMobileNav()" title="关闭导航" aria-label="关闭导航">×</button>
    </div>

    <div class="sidebar-block nav-block" id="sidebar-nav-list">
      <nav class="sidebar-grouped-nav" id="top-page-nav-list">

        <!-- 运行 -->
        <div class="nav-group" id="navgroup-runtime" data-group="runtime">
          <button class="nav-group-header" onclick="toggleNavGroup('runtime')" type="button">
            <span class="nav-group-icon">▾</span>
            <span class="nav-group-label" data-i18n="nav.group.runtime">运行</span>
          </button>
          <div class="nav-group-items-wrap"><div class="nav-group-items">
            <button class="nav-pill top-nav-btn active" id="tab-account" data-group="runtime" onclick="showSection('account')"><span data-i18n="nav.account">账号</span></button>
            <button class="nav-pill top-nav-btn" id="tab-chat" data-group="runtime" onclick="showSection('chat')"><span data-i18n="nav.chat">聊天</span></button>
            <button class="nav-pill top-nav-btn" id="tab-requests" data-group="runtime" onclick="showSection('requests')"><span data-i18n="nav.requests">请求</span></button>
            <button class="nav-pill top-nav-btn" id="tab-token-usage" data-group="runtime" onclick="showSection('token-usage')"><span data-i18n="nav.tokenUsage">Token 用量</span></button>
            <button class="nav-pill top-nav-btn" id="tab-clients" data-group="runtime" onclick="showSection('clients')"><span data-i18n="nav.clients">客户端</span></button>
            <button class="nav-pill top-nav-btn" id="tab-settings" data-group="runtime" onclick="showSection('settings')"><span data-i18n="nav.settings">设置</span></button>
          </div></div>
        </div>

        <!-- 配置 -->
        <div class="nav-group" id="navgroup-config" data-group="config">
          <button class="nav-group-header" onclick="toggleNavGroup('config')" type="button">
            <span class="nav-group-icon">▾</span>
            <span class="nav-group-label" data-i18n="nav.group.config">配置</span>
          </button>
          <div class="nav-group-items-wrap"><div class="nav-group-items">
            <button class="nav-pill top-nav-btn" id="tab-providers" data-group="config" onclick="showSection('providers')"><span data-i18n="nav.providers">提供方</span></button>
            <button class="nav-pill top-nav-btn" id="tab-media-models" data-group="config" onclick="showSection('media-models')"><span>图像/视频</span></button>
            <button class="nav-pill top-nav-btn" id="tab-aggregates" data-group="config" onclick="showSection('aggregates')"><span data-i18n="nav.aggregates">聚合</span></button>
            <button class="nav-pill top-nav-btn" id="tab-model-map" data-group="config" onclick="showSection('model-map')"><span data-i18n="nav.modelMap">映射</span></button>
            <button class="nav-pill top-nav-btn" id="tab-api-key-intake" data-group="config" onclick="showSection('api-key-intake')"><span>接入</span></button>
            <button class="nav-pill top-nav-btn" id="tab-auths" data-group="config" onclick="showSection('auths')"><span data-i18n="nav.auths">OAuth</span></button>
          </div></div>
        </div>

        <!-- 接入：只留高频入口；终端/工具/放行/文档走系统中心 -->
        <div class="nav-group" id="navgroup-access" data-group="access">
          <button class="nav-group-header" onclick="toggleNavGroup('access')" type="button">
            <span class="nav-group-icon">▾</span>
            <span class="nav-group-label" data-i18n="nav.group.access">接入</span>
          </button>
          <div class="nav-group-items-wrap"><div class="nav-group-items">
            <button class="nav-pill top-nav-btn" id="tab-virtual-keys" data-group="access" onclick="showSection('virtual-keys')"><span data-i18n="nav.virtualKeys">密钥管理</span></button>
            <button class="nav-pill nav-hidden" id="tab-firewall-access" data-group="system" onclick="showSection('firewall-access')"><span data-i18n="nav.firewallAccess">端口放行</span></button>
            <button class="nav-pill nav-hidden" id="tab-terminals" data-group="system" onclick="showSection('terminals')"><span data-i18n="nav.terminals">终端</span></button>
            <button class="nav-pill top-nav-btn" id="tab-tools" data-group="access" onclick="showSection('tools')"><span data-i18n="nav.tools">工具</span></button>
            <button class="nav-pill top-nav-btn" id="tab-doc" data-group="access" onclick="showSection('doc')"><span data-i18n="nav.doc">文档</span></button>
          </div></div>
        </div>

        <!-- 系统 -->
        <div class="nav-group" id="navgroup-system" data-group="system">
          <button class="nav-group-header" onclick="toggleNavGroup('system')" type="button">
            <span class="nav-group-icon">▾</span>
            <span class="nav-group-label" data-i18n="nav.group.system">系统</span>
          </button>
          <div class="nav-group-items-wrap"><div class="nav-group-items">
            <button class="nav-pill top-nav-btn" id="tab-system" data-group="system" onclick="showSection('system')"><span data-i18n="nav.systemCenter">系统中心</span></button>
            <button class="nav-pill nav-hidden" id="tab-model-stats" data-group="system" onclick="showSection('model-stats')"><span data-i18n="nav.modelStats">模型统计</span></button>
            <button class="nav-pill nav-hidden" id="tab-model-thinking" data-group="system" onclick="showSection('model-thinking')"><span>Thinking</span></button>
          </div></div>
        </div>

      </nav>
    </div>

    <div class="sidebar-block sidebar-controls">
      <button class="nav-btn secondary theme-btn" id="theme-toggle" onclick="toggleTheme()">主题：暗色</button>
      <button class="nav-btn secondary theme-btn" id="lang-toggle" onclick="toggleLanguage()" style="display: none;">Language</button>
    </div>
  </aside>

  <main class="workspace">
    <div id="message" class="message"></div>

    <div class="content-grid" id="main-sections">
      <!-- INCLUDE: sections/system.html -->
    </div>
  </main>
</div>

<script src="/js/i18n.js?v=20260718-grok2api-labels"></script>
<script src="/js/core.js?v=20260721-fetch-hint"></script>

<script src="/js/overview-panel.js?v=20260718-indicator-memory"></script>
<script src="/js/auth.js?v=20260718-model-queue-lights"></script>
<script src="/js/providers.js?v=20260718-overflow-fix"></script>
<script src="/js/media-models.js"></script>
<script src="/js/api-key-intake.js?v=20260608-provider-sync"></script>
<script src="/js/model-proxies.js?v=20260504-2"></script>
<script src="/js/model-thinking.js"></script>
<script src="/js/requests-panel.js?v=20260721-success-collapse"></script>
<script src="/js/token-usage.js?v=20260703-3"></script>
<script src="/js/clients-panel.js?v=20260608-ip-clients-redesign"></script>
<script src="/js/models-panel.js?v=20260528-provider-only"></script>
<script src="/js/cooldown-panel.js?v=20260504-2"></script>
<script src="/js/virtual-keys.js?v=20260504-1"></script>
<script src="/js/network-access.js?v=20260527-firewall-2"></script>
<script src="/js/firewall-access.js?v=20260716-ip-helper-indicator-cache"></script>
<script src="/js/tools.js?v=20260720-dashboard-relaunch-guards"></script>
<script src="/js/advanced-config.js?v=20260731-core-compat"></script>
<script src="/js/cloaking-config.js?v=20260522-1"></script>
<script src="/js/amp-config.js?v=20260522-1"></script>
<script src="/js/storage-config.js?v=20260522-1"></script>
<script src="/js/home-config.js?v=20260522-1"></script>
<script src="/js/docker-deploy.js?v=20260522-1"></script>
<script src="/js/settings.js"></script>
<script src="/js/boot.js?v=20260720-boot-no-reload-churn"></script>
<!-- Heavy: chat / aggregates / terminals (+ xterm/marked/highlight) load on first open via core.js -->

<!-- INCLUDE: sections/modals.html -->

</body>
</html>
